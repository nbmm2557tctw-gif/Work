<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>排班日曆</title>

    <link rel="icon" href="png/sun.png" type="image/png">

    <!-- FullCalendar -->
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js'></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 10px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        #calendar {
            max-width: 1400px;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.08);
        }

        button {
            cursor: pointer;
        }

        /* 日期 */

        .fc-daygrid-day-number {
            font-weight: bold;
            color: black;
            font-size: 22px;
        }

        /* 日曆格 */

        .fc-daygrid-day-frame {
            min-height: 180px;
            overflow-y: auto;
            padding: 5px;
        }

        /* 日程表文字 */

        .calendar-shift {
            font-size: 22px;
            line-height: 1.4;
            color: black;
            margin-top: 8px;
            padding: 2px 0;
            word-break: break-word;
            font-weight: 500;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
        }

        .modal-content {
            background: white;
            width: 450px;
            margin: 5% auto;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
        }

        /* 班別 */

        .shift-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .shift-list label {
            font-size: 18px;
        }

        .shift-list input {
            transform: scale(1.3);
            margin-right: 5px;
        }

        /* 按鈕 */

        .modal-buttons {
            margin-top: 20px;
            text-align: center;
        }

        .modal-buttons button {
            margin: 5px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
        }

        .save-btn {
            background: #4caf50;
        }

        .delete-btn {
            background: #f44336;
        }

        .close-btn {
            background: #777;
        }

        .add-btn {
            background: #1976d2;
        }

        .remove-btn {
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
        }

        /* Login */

        #loginForm {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
        }

        .login-content {
            background: white;
            width: 300px;
            margin: 15% auto;
            padding: 20px;
            border-radius: 12px;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
            background: #f2f2f2;
            border-top: 1px solid #ddd;
        }

        .admin-panel {
            margin-top: 20px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .shift-manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 16px;
        }

        @media (max-width: 768px) {

            #calendar {
                margin: 10px;
                padding: 8px;
            }

            .modal-content {
                width: 92%;
                box-sizing: border-box;
            }

            .shift-list {
                grid-template-columns: repeat(2, 1fr);
            }

            .calendar-shift {
                font-size: 20px;
            }

            .fc-daygrid-day-number {
                font-size: 18px;
            }

            .fc-daygrid-day-frame {
                min-height: 140px;
            }

        }
    </style>
</head>

<body>

    <div class="top-bar">

        <button id="loginBtn">
            登入
        </button>

        <button id="logoutBtn"
            style="display:none;">
            登出
        </button>

    </div>

    <!-- 日曆 -->
    <div id="calendar"></div>

    <!-- 登入 -->
    <div id="loginForm">

        <div class="login-content">

            <h3>登入</h3>

            <input type="password"
                id="password"
                placeholder="輸入密碼"
                style="
                    width:100%;
                    padding:10px;
                    margin-top:10px;
                    box-sizing:border-box;
                ">

            <br><br>

            <button id="submitLogin">
                確定
            </button>

        </div>

    </div>

    <!-- 班表視窗 -->
    <div id="shiftModal" class="modal">

        <div class="modal-content">

            <h3 id="selectedDateTitle">
                選擇班別
            </h3>

            <!-- 班別 -->
            <div class="shift-list" id="shiftList"></div>

            <div class="modal-buttons">

                <button class="save-btn"
                    id="saveShift">
                    儲存
                </button>

                <button class="delete-btn"
                    id="deleteShift">
                    清除
                </button>

                <button class="close-btn"
                    id="closeModal">
                    關閉
                </button>

            </div>

            <!-- 管理員 -->
            <div class="admin-panel"
                id="adminPanel"
                style="display:none;">

                <h4>管理班別</h4>

                <input type="text"
                    id="newShiftInput"
                    placeholder="新增班別 14:00-16:00"
                    style="
                        width:100%;
                        padding:10px;
                        box-sizing:border-box;
                    ">

                <br><br>

                <button class="add-btn"
                    id="addShiftBtn">
                    新增班別
                </button>

                <div id="shiftManageList"
                    style="margin-top:15px;"></div>

            </div>

        </div>

    </div>

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            setDoc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

        // Firebase
        const firebaseConfig = {

            apiKey: "AIzaSyD4qOjXXx80JmOOt79N3Chry1Q9-A_FML4",

            authDomain: "hnnh-5dfe1.firebaseapp.com",

            projectId: "hnnh-5dfe1",

            storageBucket: "hnnh-5dfe1.firebasestorage.app",

            messagingSenderId: "400569789956",

            appId: "1:400569789956:web:6e68ae42f38c1f14fc0f51"

        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        const loginForm = document.getElementById("loginForm");
        const submitLogin = document.getElementById("submitLogin");
        const passwordInput = document.getElementById("password");

        const shiftModal = document.getElementById("shiftModal");
        const saveShift = document.getElementById("saveShift");
        const deleteShift = document.getElementById("deleteShift");
        const closeModal = document.getElementById("closeModal");

        const selectedDateTitle = document.getElementById("selectedDateTitle");

        const shiftList = document.getElementById("shiftList");

        const adminPanel = document.getElementById("adminPanel");

        const addShiftBtn = document.getElementById("addShiftBtn");

        const newShiftInput = document.getElementById("newShiftInput");

        const shiftManageList = document.getElementById("shiftManageList");

        // Login
        const PASSWORD = "admin4335";

        let isLoggedIn = false;

        let currentDate = null;

        // 班別
        let shiftOptions = [

            "10:00-14:00",
            "10:00-13:00",
            "11:00-14:00",
            "11:00-15:00",
            "12:00-14:00",
            "12:00-16:00",
            "14:00-16:00",
            "17:30-21:30",
            "17:30-20:00",
            "18:00-21:30"

        ];

        // 班別渲染
        function renderShiftOptions(selectedValue = "") {

            shiftList.innerHTML = "";

            shiftOptions.forEach(shift => {

                const checked =
                    selectedValue.includes(shift)
                        ? "checked"
                        : "";

                const label =
                    document.createElement("label");

                label.innerHTML = `
                    <input
                        type="checkbox"
                        value="${shift}"
                        ${checked}
                    >
                    ${shift}
                `;

                shiftList.appendChild(label);

            });

            renderShiftManage();

        }

        // 管理班別
        function renderShiftManage() {

            shiftManageList.innerHTML = "";

            shiftOptions.forEach((shift, index) => {

                const div =
                    document.createElement("div");

                div.className =
                    "shift-manage-item";

                div.innerHTML = `
                    <span>${shift}</span>

                    <button
                        class="remove-btn"
                        data-index="${index}">
                        刪除
                    </button>
                `;

                shiftManageList.appendChild(div);

            });

            document.querySelectorAll(".remove-btn")
                .forEach(btn => {

                    btn.addEventListener(
                        "click",
                        () => {

                            const index =
                                parseInt(
                                    btn.dataset.index
                                );

                            if (
                                confirm(
                                    "確定刪除班別？"
                                )
                            ) {

                                shiftOptions.splice(
                                    index,
                                    1
                                );

                                renderShiftOptions();

                            }

                        }
                    );

                });

        }

        // Firestore
        function getMonthDoc(dateStr) {

            const date =
                new Date(dateStr);

            const year =
                date.getFullYear();

            const month =
                String(date.getMonth() + 1)
                    .padStart(2, "0");

            return doc(
                db,
                "shifts",
                `month-${year}-${month}`
            );

        }

        // 日曆
        const calendarEl =
            document.getElementById("calendar");

        const calendar =
            new FullCalendar.Calendar(
                calendarEl,
                {

                    initialView: 'dayGridMonth',

                    locale: 'zh-tw',

                    height: 'auto',

                    dateClick: async function(info) {

                        if (!isLoggedIn) return;

                        currentDate =
                            info.dateStr;

                        selectedDateTitle.innerText =
                            currentDate;

                        const docRef =
                            getMonthDoc(currentDate);

                        const snap =
                            await getDoc(docRef);

                        const data =
                            snap.exists()
                                ? snap.data()
                                : {};

                        const day =
                            new Date(currentDate)
                                .getDate();

                        const value =
                            data[`day-${day}`] || "";

                        renderShiftOptions(value);

                        shiftModal.style.display =
                            "block";

                    },

                    dayCellDidMount: async function(info) {

                        const date =
                            info.date;

                        const year =
                            date.getFullYear();

                        const month =
                            String(date.getMonth() + 1)
                                .padStart(2, "0");

                        const day =
                            date.getDate();

                        const docRef = doc(
                            db,
                            "shifts",
                            `month-${year}-${month}`
                        );

                        const snap =
                            await getDoc(docRef);

                        const data =
                            snap.exists()
                                ? snap.data()
                                : {};

                        const value =
                            data[`day-${day}`] || "";

                        if (!value) return;

                        const shifts = value
                            .split("\n")
                            .filter(v => v.includes(":"));

                        shifts.forEach(shift => {

                            const shiftDiv =
                                document.createElement("div");

                            shiftDiv.className =
                                "calendar-shift";

                            shiftDiv.innerText =
                                shift;

                            info.el.appendChild(
                                shiftDiv
                            );

                        });

                    }

                }
            );

        calendar.render();

        // 不重新整理頁面
        function refreshCalendar() {

            calendar.destroy();

            calendar.render();

        }

        // 登入
        loginBtn.addEventListener(
            "click",
            () => {

                loginForm.style.display =
                    "block";

            }
        );

        submitLogin.addEventListener(
            "click",
            () => {

                if (
                    passwordInput.value ===
                    PASSWORD
                ) {

                    isLoggedIn = true;

                    loginForm.style.display =
                        "none";

                    loginBtn.style.display =
                        "none";

                    logoutBtn.style.display =
                        "inline-block";

                    adminPanel.style.display =
                        "block";

                } else {

                    alert("密碼錯誤");

                }

            }
        );

        // 登出
        logoutBtn.addEventListener(
            "click",
            () => {

                isLoggedIn = false;

                loginBtn.style.display =
                    "inline-block";

                logoutBtn.style.display =
                    "none";

            }
        );

        // 儲存
        saveShift.addEventListener(
            "click",
            async () => {

                const selected = [];

                document.querySelectorAll(
                    "#shiftList input[type=checkbox]:checked"
                ).forEach(cb => {

                    selected.push(cb.value);

                });

                const finalValue =
                    selected.join("\n");

                const docRef =
                    getMonthDoc(currentDate);

                const day =
                    new Date(currentDate)
                        .getDate();

                await setDoc(
                    docRef,
                    {
                        [`day-${day}`]:
                            finalValue
                    },
                    {
                        merge: true
                    }
                );

                shiftModal.style.display =
                    "none";

                refreshCalendar();

            }
        );

        // 清除
        deleteShift.addEventListener(
            "click",
            async () => {

                const docRef =
                    getMonthDoc(currentDate);

                const day =
                    new Date(currentDate)
                        .getDate();

                await setDoc(
                    docRef,
                    {
                        [`day-${day}`]:
                            ""
                    },
                    {
                        merge: true
                    }
                );

                shiftModal.style.display =
                    "none";

                refreshCalendar();

            }
        );

        // 關閉
        closeModal.addEventListener(
            "click",
            () => {

                shiftModal.style.display =
                    "none";

            }
        );

        // 新增班別
        addShiftBtn.addEventListener(
            "click",
            () => {

                const value =
                    newShiftInput.value.trim();

                if (!value) return;

                if (
                    shiftOptions.includes(value)
                ) {

                    alert("班別已存在");

                    return;

                }

                shiftOptions.push(value);

                renderShiftOptions();

                newShiftInput.value = "";

            }
        );

        renderShiftOptions();

    </script>

</body>

</html>
